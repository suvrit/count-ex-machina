<!doctype html>
<!--
  Source of assets/social-preview.png, the image uploaded under
  Settings > General > Social preview.  GitHub wants 1280x640; render at 2x and
  downscale so the type stays crisp:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=2 --window-size=1280,640 \
      --screenshot=banner2x.png "file://$PWD/assets/social-preview.html"
    magick banner2x.png -resize 1280x640 -strip -quality 92 assets/social-preview.png

  Deliberately carries no counts: a number baked into a PNG cannot be
  regenerated by tools/build.py, so it would be stale the day a case is
  admitted.  The README badges are the place for numbers.
-->
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: #0d1117;
    font-family: "Helvetica Neue", "SF Pro Text", Helvetica, sans-serif;
    color: #e6edf3;
    overflow: hidden;
    position: relative;
  }
  .glow-a, .glow-b { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow-a { width: 620px; height: 620px; left: -190px; top: -230px;
            background: rgba(11, 114, 133, 0.45); }
  .glow-b { width: 560px; height: 560px; right: -200px; bottom: -260px;
            background: rgba(34, 73, 107, 0.55); }

  /* The archive's whole subject, stated once in the background: the negation of
     a universal claim is an explicit witness. */
  .motif {
    position: absolute; inset: 0; display: flex;
    align-items: flex-end; justify-content: center;
    font-family: Palatino, "Iowan Old Style", Georgia, serif;
    font-style: italic; font-size: 88px; letter-spacing: 2px;
    color: #ffffff; opacity: 0.06; white-space: nowrap;
    padding-bottom: 42px;
  }

  .frame {
    position: absolute; inset: 34px;
    border: 1px solid rgba(120, 160, 185, 0.20); border-radius: 10px;
  }

  main {
    position: relative; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 0 96px;
  }
  .eyebrow {
    font-size: 20px; font-weight: 600; letter-spacing: 6.5px;
    text-transform: uppercase; color: #4dbdd0;
  }
  h1 {
    margin-top: 22px;
    font-family: Palatino, "Iowan Old Style", Georgia, serif;
    font-size: 104px; font-weight: 700; letter-spacing: -1.5px;
    line-height: 1.02; color: #ffffff;
  }
  .rule {
    width: 132px; height: 3px; margin: 30px 0 28px;
    background: linear-gradient(90deg, #4dbdd0, #22496b);
    border-radius: 2px;
  }
  .tagline { font-size: 34px; font-weight: 400; color: #c6d3e0; letter-spacing: 0.2px; }
  .sub {
    margin-top: 20px; font-size: 22px; color: #8399ad; letter-spacing: 0.4px;
  }
  .url {
    margin-top: 34px;
    font-family: Palatino, "Iowan Old Style", Georgia, serif;
    font-style: italic; font-size: 25px; color: #6f889e;
  }
</style>
<div class="glow-a"></div>
<div class="glow-b"></div>
<div class="motif">&not;&forall;x&thinsp;P(x) &nbsp;&hArr;&nbsp; &exist;x&thinsp;&not;P(x)</div>
<div class="frame"></div>
<main>
  <div class="eyebrow">An audited archive</div>
  <h1>count-ex-machina</h1>
  <div class="rule"></div>
  <div class="tagline">Counterexamples found by AI, certified by exact arithmetic.</div>
  <div class="sub">exact rational witnesses &middot; rigorous interval certificates &middot; every case recomputes</div>
  <div class="url">github.com/suvrit/count-ex-machina</div>
</main>
